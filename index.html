<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SIM-PKL SMK</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-dark min-vh-100 d-flex align-items-center justify-content-center p-3">

    <div class="bg-white rounded-4 shadow-lg overflow-hidden w-100" style="max-width: 400px;">
        <div class="bg-primary text-white p-4 text-center">
            <i class="bi bi-mortarboard-fill fs-1"></i>
            <h5 class="fw-bold mb-1">SIM-PKL SMK</h5>
            <small class="text-white-50">Pemilihan &amp; Monitoring Tempat PKL</small>
        </div>

        <form id="form-login" class="p-4">
            <div id="msg" class="alert py-2 small d-none"></div>

            <label class="form-label small fw-semibold">Username / Email</label>
            <input type="text" id="username" class="form-control mb-3" required>

            <label class="form-label small fw-semibold">Password</label>
            <input type="password" id="password" class="form-control mb-3" required>

            <button type="submit" class="btn btn-primary w-100 fw-semibold">Masuk</button>

            <p class="small text-muted text-center mt-3 mb-0">
                Contoh: admin, budi, andi, dika | Pass: 123456
            </p>
        </form>
    </div>

    <script>
        const akun = [
            { user: 'admin', email: 'admin@smk.sch.id', role: 'Admin', nama: 'Administrator Sekolah' },
            { user: 'budi', email: 'guru@smk.sch.id', role: 'Guru', nama: 'Budi Santoso, S.Kom.' },
            { user: 'andi', email: 'andi@siswa.smk.sch.id', role: 'Siswa', nama: 'Andi Pratama' },
            { user: 'dika', email: 'dika@alumni.smk.sch.id', role: 'Alumni', nama: 'Dika Saputra' }
        ];

        document.getElementById('form-login').onsubmit = e => {
            e.preventDefault();
            const val = document.getElementById('username').value.trim().toLowerCase();
            const p = akun.find(a => a.user === val || a.email === val);
            const msg = document.getElementById('msg');

            if (!p || document.getElementById('password').value !== '123456') {
                msg.className = 'alert alert-danger py-2 small';
                msg.textContent = 'Username atau password salah.';
                return;
            }

            msg.className = 'alert alert-success py-2 small';
            msg.textContent = `Berhasil masuk sebagai ${p.nama} (${p.role})`;
            // Jika ingin pindah halaman saat berhasil, hapus 2 baris di atas dan aktifkan baris bawah:
            // location.href = 'dashboard.html';
        };
    </script>
</body>
</html>
