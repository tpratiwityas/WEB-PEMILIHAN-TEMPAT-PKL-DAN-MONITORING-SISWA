<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIM-PKL SMK - Profil</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light">

    <!-- ===== HALAMAN LOGIN ===== -->
    <section id="login-page" class="min-vh-100 d-flex align-items-center justify-content-center p-3 bg-dark">
        <div class="bg-white rounded-4 shadow-lg overflow-hidden w-100" style="max-width: 400px;">
            <div class="bg-primary text-white p-4 text-center">
                <i class="bi bi-mortarboard-fill fs-1"></i>
                <h5 class="fw-bold mb-1">SIM-PKL SMK</h5>
                <small class="text-white-50">Pemilihan &amp; Monitoring Tempat PKL</small>
            </div>
            <form id="form-login" class="p-4">
                <div id="login-error" class="alert alert-danger py-2 small d-none">Username atau password salah.</div>
                <label class="form-label small fw-semibold">Username / Email</label>
                <input type="text" id="username" class="form-control mb-3" required>
                <label class="form-label small fw-semibold">Password</label>
                <input type="password" id="password" class="form-control mb-3" required>
                <button type="submit" class="btn btn-primary w-100 fw-semibold">Masuk</button>
                <p class="small text-muted text-center mt-3 mb-0">
                    Contoh: admin, budi (guru), andi (siswa), dika (alumni)<br>Password: 123456
                </p>
            </form>
        </div>
    </section>

    <!-- ===== HALAMAN PROFIL ===== -->
    <div id="app" class="d-none min-vh-100 d-flex align-items-center justify-content-center p-3">
        <div class="bg-white rounded-4 shadow p-4 w-100" style="max-width: 500px;">
            <div class="d-flex justify-content-between align-items-center border-bottom pb-3 mb-3">
                <span class="badge bg-primary fs-6" id="profil-role"></span>
                <button class="btn btn-outline-danger btn-sm" id="btn-logout">Logout</button>
            </div>

            <div class="text-center mb-3">
                <div class="bg-primary bg-opacity-10 text-primary rounded-circle d-inline-flex align-items-center justify-content-center mb-2" style="width: 72px; height: 72px;">
                    <i class="bi bi-person-badge fs-1"></i>
                </div>
                <h4 class="fw-bold mb-1" id="profil-nama"></h4>
                <p class="text-muted small mb-0" id="profil-identitas"></p>
            </div>

            <div class="bg-light rounded-3 p-3 border-start border-4 border-primary">
                <small class="fw-bold text-primary d-block mb-1">Keterangan Hak Akses:</small>
                <p class="small text-secondary mb-0" id="profil-ket"></p>
            </div>
        </div>
    </div>

    <script>
        const $ = id => document.getElementById(id);
        const akun = [
            { user: 'admin', email: 'admin@smk.sch.id', role: 'ADMINISTRATOR', nama: 'Administrator Sekolah', info: 'NIP. 198001012005011001 • Staf Tata Usaha & Koordinator Pokja PKL', ket: 'Anda masuk sebagai Admin. Bertugas mengelola akun pengguna, kuota industri mitra, dan rekap data pengajuan PKL.' },
            { user: 'budi', email: 'guru@smk.sch.id', role: 'GURU PEMBIMBING', nama: 'Budi Santoso, S.Kom.', info: 'NIP. 198504122010011009 • Guru Jurusan Rekayasa Perangkat Lunak', ket: 'Anda masuk sebagai Guru Pembimbing. Bertugas memvalidasi pengajuan tempat PKL dan memverifikasi jurnal kegiatan siswa.' },
            { user: 'andi', email: 'andi@siswa.smk.sch.id', role: 'SISWA PKL', nama: 'Andi Pratama', info: 'NIS. 20241001 • Kelas XI RPL 1', ket: 'Anda masuk sebagai Siswa. Bertugas memilih tempat industri, mengisi laporan monitoring harian, dan memantau nilai akhir.' },
            { user: 'dika', email: 'dika@alumni.smk.sch.id', role: 'ALUMNI', nama: 'Dika Saputra', info: 'Angkatan 2025 • Alumni Jurusan RPL (Eks-PKL PT. Maju Jaya Abadi)', ket: 'Anda masuk sebagai Alumni. Bertugas membagikan pengalaman kerja lapangan serta memberikan ulasan & rating tempat PKL.' }
        ];

        const toggleView = login => {
            $('login-page').classList.toggle('d-none', login);
            $('login-page').classList.toggle('d-flex', !login);
            $('app').classList.toggle('d-none', !login);
        };

        $('form-login').onsubmit = e => {
            e.preventDefault();
            const val = $('username').value.trim().toLowerCase();
            const p = akun.find(a => a.user === val || a.email === val);

            if (!p || $('password').value !== '123456') return $('login-error').classList.remove('d-none');

            $('login-error').classList.add('d-none');
            $('profil-role').textContent = `Login sebagai ${p.role}`;
            $('profil-nama').textContent = p.nama;
            $('profil-identitas').textContent = p.info;
            $('profil-ket').textContent = p.ket;

            toggleView(true);
        };

        $('btn-logout').onclick = () => { toggleView(false); $('form-login').reset(); };
    </script>
</body>
</html>
